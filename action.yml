name: "Glog Scan Action"
description: "Scan source code and provide remediation advice for fixing only the real issues"
author: "Glog.AI"
inputs:
  lang:
    description: "List of languages to scan separated by a comma e.g.: java,c,python"
    required: false
  client:
    description: "Specify client name."
    required: false
  env:
    description: "Specify environment name like: 'dev' for https://<client>.dev.glog.ai. Default is none: https://<client>.glog.ai"
    required: false
  ignore:
    description: "List of directories to be skipped separated by a comma e.g.: dir1,dir2"
    required: false
  debug:
    description: "Enable debug logging"
    required: false
    default: 'false'
  upload:
    description: "Upload Glog assessment file to Github Security page"
    required: false
    default: 'true'
  on-prem-upload:
    description: "Upload scan results to On-Prem Dashboard (passes --upload to resolver scanner)"
    required: false
    default: 'false'
  path:
    description: Relative path
    required: false
    default: '.'
  github-token:
    description: "Optional GitHub token. If omitted, the workflow's built-in GITHUB_TOKEN is used automatically. Provide a PAT only if you need broader scopes (e.g. private GHCR pulls, cross-repo issue creation)."
    required: false
    default: ''
  glog-token:
    required: true
  issue:
    description: Upload Glog issues as Github issues. Default is false.
    required: false
    default: false
  autofix:
    description: Automatically create PR for the issues found. Default is false.
    required: false
    default: false
  max-issues:
    description: Maximum number of SARIF findings to convert into GitHub issues per run. Default is 30.
    required: false
    default: "30"
  max-assign:
    description: Maximum number of created issues to assign to Copilot for autofix. Default is 30.
    required: false
    default: "30"
  files:
    description: "List of files to scan separated by a comma e.g.: src/A.java,src/B.java"
    required: false
  inventory:
    description: "Force the inventory scanner to run regardless of language auto-detection. Default is false."
    required: false
    default: 'false'
  sbom:
    description: "Generate a CycloneDX SBOM via the resolver scanner (passes --with-sbom). If on-prem-upload=true the SBOM is also persisted on the server alongside the SARIF; otherwise it stays local in .glog/. Default is false."
    required: false
    default: 'false'
  sbom-only:
    description: "Skip SARIF and only produce the SBOM (passes --sbom-only to the resolver). Implies sbom=true. Default is false."
    required: false
    default: 'false'
  scl-uuid:
    description: "Source Code Location UUID to bind scan results (SARIF/SBOM) to on the Glog server. If omitted, the server tries to match an existing SCL from the scan metadata and creates one if no match is found."
    required: false
  privacy-tier:
    description: "Privacy tier: 'full' (default, uploads SARIF + SBOM), 'metrics' (Iteration 4, currently treated as no-upload), 'none' (skip all uploads, same as anonymous)."
    required: false
    default: 'full'
  api-url:
    description: "Override the Glog.AI server URL (e.g. https://test.dev.glog.ai). If unset, the resolver uses the URL baked into the image."
    required: false
    default: ''
  sarif-format-type:
    description: "SARIF structure produced for this platform: GITHUB (GitHub Advanced Security / Security tab), AZURE, GITLAB or STANDARD (issues / plain commit). Default is GITHUB."
    required: false
    default: 'GITHUB'
  server-sarif-format-type:
    description: "Optional second SARIF format used for the upload to the Glog server (normally STANDARD). Set it when the platform needs a different structure than the server; the resolver then runs twice and the platform format is the one committed."
    required: false
    default: ''

runs:
  using: "composite"
  steps:
    # Preflight: probe the resolved token's permissions and fail fast with a
    # copy-pasteable `permissions:` block if anything required is missing.
    - name: Preflight - verify GITHUB_TOKEN permissions
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token != '' && inputs.github-token || github.token }}
        REPO: ${{ github.repository }}
        NEED_ISSUES: ${{ inputs.issue }}
        NEED_AUTOFIX: ${{ inputs.autofix }}
        NEED_UPLOAD: ${{ inputs.upload }}
        USER_TOKEN: ${{ inputs.github-token }}
      run: |
        set -u
        api() {
          # $1=method $2=path $3=body(optional)  -> prints HTTP status
          local method="$1" path="$2" body="${3:-}"
          local args=(-s -o /tmp/glog_preflight.out -w '%{http_code}'
                      -X "$method"
                      -H "Authorization: Bearer $GH_TOKEN"
                      -H "Accept: application/vnd.github+json"
                      -H "X-GitHub-Api-Version: 2022-11-28")
          [ -n "$body" ] && args+=(-H "Content-Type: application/json" --data "$body")
          curl "${args[@]}" "https://api.github.com$path" || echo "000"
        }

        missing=()
        warnings=()

        # contents:write -- needed for `git push` of the committed SARIF.
        # Probe by creating a tiny blob (no ref impact, no visible artifact).
        code=$(api POST "/repos/$REPO/git/blobs" '{"content":"glog-preflight","encoding":"utf-8"}')
        if [ "$code" != "201" ] && [ "$code" != "200" ]; then
          echo "::warning::contents:write probe returned HTTP $code: $(head -c 300 /tmp/glog_preflight.out)"
          if [ "$code" = "401" ]; then
            missing+=("contents: write (token rejected - HTTP 401, check the PAT value / expiry)")
          elif [ "$code" = "404" ]; then
            missing+=("contents: write (HTTP 404 - the token cannot see $REPO; fine-grained PATs need Repository access + Contents: Read and write)")
          else
            missing+=("contents: write")
          fi
        fi

        # security-events:write -- only if SARIF upload to GitHub Security is on.
        # A 403 here is ambiguous: it can mean a missing permission OR that
        # GitHub Advanced Security / Code Scanning is not enabled for the repo.
        # Only the latter is not our problem, so classify by the API message.
        if [ "$NEED_UPLOAD" = "true" ]; then
          code=$(api GET "/repos/$REPO/code-scanning/alerts?per_page=1")
          if [ "$code" = "403" ]; then
            body=$(head -c 400 /tmp/glog_preflight.out)
            if echo "$body" | grep -qi "advanced security\|code scanning is not enabled\|not enabled for this repository"; then
              warnings+=("Code Scanning / GitHub Advanced Security is not enabled for $REPO - the SARIF upload step will be skipped by GitHub. Enable Advanced Security or set upload:false.")
            else
              echo "::warning::security-events probe returned HTTP 403: $body"
              missing+=("security-events: write")
            fi
          fi
        fi

        # issues:write -- only if creating GitHub issues from SARIF.
        if [ "$NEED_ISSUES" = "true" ]; then
          code=$(api GET "/repos/$REPO/issues?per_page=1&state=all")
          if [ "$code" = "403" ]; then
            missing+=("issues: write")
          fi
        fi

        # pull-requests:write -- only if Copilot autofix PR creation is on.
        if [ "$NEED_AUTOFIX" = "true" ]; then
          code=$(api GET "/repos/$REPO/pulls?per_page=1&state=all")
          if [ "$code" = "403" ]; then
            missing+=("pull-requests: write")
          fi
        fi

        for w in "${warnings[@]:-}"; do
          [ -n "$w" ] && echo "::warning title=Glog.AI preflight::$w"
        done

        if [ ${#missing[@]} -eq 0 ]; then
          echo "Glog preflight OK - token has the required permissions."
          exit 0
        fi

        {
          echo "::error title=Glog.AI: GITHUB_TOKEN is missing required permissions::"
          echo ""
          echo "The token used by Glog.AI does not have all the required permissions."
          echo "Add the following block to your workflow (job-level is recommended):"
          echo ""
          echo "permissions:"
          echo "  contents: write"
          echo "  packages: read"
          for p in "${missing[@]}"; do
            case "$p" in
              contents:*) ;; # already printed above
              *) echo "  $p" ;;
            esac
          done
          echo ""
          echo "Then re-run the job. Alternatively, set Repo Settings -> Actions -> General ->"
          echo "Workflow permissions to 'Read and write permissions' (covers contents/issues/PRs;"
          echo "'security-events: write' still needs to be added to the workflow for SARIF upload)."
          if [ -n "$USER_TOKEN" ]; then
            echo ""
            echo "Note: a custom github-token (PAT) was provided, and it is the token probed above."
            echo "The workflow 'permissions:' block does NOT apply to a PAT - the PAT itself must"
            echo "carry the rights: classic PAT -> scopes 'repo' + 'security_events' + 'read:packages';"
            echo "fine-grained PAT -> repository access to $REPO with Contents: Read and write,"
            echo "Code scanning alerts: Read and write, Issues: Read and write, Pull requests: Read and write."
            echo "Also confirm SSO authorization for the organization if applicable."
          fi
        } >&2
        exit 1


    - name: Clean .glog directory
      run: |
        echo "Checking .glog directory..."
        if [ -d "$GITHUB_WORKSPACE/.glog" ]; then
          echo ".glog directory exists. Cleaning up..."
          rm -rf "$GITHUB_WORKSPACE/.glog/"*
        else
          echo "$GITHUB_WORKSPACE .glog directory does not exist."
        fi
      shell: bash

    # Optional: only needed when pulling glogai images from a private GHCR.
    # Since glogai images on ghcr.io are now public, this step is skipped
    # automatically when no github-token is provided.
    - name: Set up auth for pulling private actions
      if: ${{ inputs.github-token != '' }}
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        GITHUB_ACTOR: ${{ github.actor }}
      run: |
        if [ -z "$GITHUB_TOKEN" ]; then
          echo "No github-token provided; skipping ghcr.io login (assuming public images)."
          exit 0
        fi
        echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin || {
          echo "ghcr.io login failed; continuing assuming images are public."
          exit 0
        }
      shell: bash

    - name: Glog Scan
      run: |
        TOOL_CMD="${{ github.action_path }}/glog.sh scan --path $GITHUB_WORKSPACE/${{ inputs.path }} --registry ghcr.io/glogai/" 
        ARGS=()
        if [ ! -z "${{ inputs.lang }}" ]; then
          ARGS+=("--lang" "${{ inputs.lang }}")
        fi
        if [ ! -z "${{ inputs.ignore }}" ]; then
          ARGS+=("--ignore" "$(printf '%q' "${{ inputs.ignore }}")")
        fi
        if [ ! -z "${{ inputs.client }}" ]; then
          ARGS+=("--client" "$(printf '%q' "${{ inputs.client }}")")
        fi
        if [ ! -z "${{ inputs.env }}" ]; then
          ARGS+=("--env" "$(printf '%q' "${{ inputs.env }}")")
        fi
        if [ -n "${{ inputs.files }}" ]; then
          ARGS+=("--files" "${{ inputs.files }}")
        fi
        if [ "${{ inputs.on-prem-upload }}" = "true" ]; then
          ARGS+=("--upload")
        fi
        if [ "${{ inputs.inventory }}" = "true" ]; then
          ARGS+=("--inventory")
        fi
        if [ "${{ inputs.sbom }}" = "true" ] || [ "${{ inputs.sbom-only }}" = "true" ]; then
          ARGS+=("--sbom")
        fi
        if [ "${{ inputs.sbom-only }}" = "true" ]; then
          ARGS+=("--sbom-only")
        fi
        if [ -n "${{ inputs.scl-uuid }}" ]; then
          ARGS+=("--scl-uuid" "${{ inputs.scl-uuid }}")
        fi
        if [ -n "${{ inputs.privacy-tier }}" ]; then
          ARGS+=("--privacy-tier" "${{ inputs.privacy-tier }}")
        fi
        if [ -n "${{ inputs.api-url }}" ]; then
          ARGS+=("--api-url" "${{ inputs.api-url }}")
        fi
        if [ -n "${{ inputs.sarif-format-type }}" ]; then
          ARGS+=("--sarif-format-type" "${{ inputs.sarif-format-type }}")
        fi
        if [ -n "${{ inputs.server-sarif-format-type }}" ]; then
          ARGS+=("--server-sarif-format-type" "${{ inputs.server-sarif-format-type }}")
        fi

        $TOOL_CMD "${ARGS[@]}"
      shell: bash
      env:
        GLOG_TOKEN: ${{ inputs.glog-token }}
        GLOG_COMPONENT: ${{ github.event.repository.name }}
        GLOG_BRANCH: ${{ github.head_ref != '' && github.head_ref || github.ref_name }}

    - name: Git Add report
      run: |
        git config --global user.name ${{ github.actor }} 
        git config --global user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"
        SARIF_PATH="$GITHUB_WORKSPACE/${{ inputs.path }}/.glog/glog-scan.sarif"
        if [ -f "$SARIF_PATH" ]; then
          git add -f "$SARIF_PATH"
        else
          echo "No SARIF report found at $SARIF_PATH, skipping."
        fi
      shell: bash

    - name: Git Add debug log
      if: ${{ inputs.debug == 'true' }}
      run: |
        LOG_PATH="$GITHUB_WORKSPACE/${{ inputs.path }}/.glog/glog-scan.log"
        [ -f "$LOG_PATH" ] && git add -f "$LOG_PATH" || echo "No debug log found, skipping."
      shell: bash

    - name: Check for staged file changes
      id: check_staged_changes
      run: |
        if git diff --staged --quiet; then
          echo "no_changes=true" >> $GITHUB_ENV
        else
          echo "no_changes=false" >> $GITHUB_ENV
        fi
      shell: bash

    - name: Git Commit report
      if: env.no_changes == 'false'
      run: |
          DATE=$(date +"%Y-%m-%d %H:%M:%S")
          git commit -am "[$DATE] Glog.AI assessment"
          git push
      shell: bash

    - name: Upload report
      if: ${{ inputs.upload == 'true' }}
      uses: github/codeql-action/upload-sarif@v4
      with:
        sarif_file: ${{ inputs.path }}/.glog/glog-scan.sarif
        category: Glog.AI 

    - name: Create / update issues from SARIF (dedupe by fingerprint)
      if: ${{ inputs.issue == 'true' }}
      id: upload-issues
      uses: actions/github-script@v8
      env:
        SARIF_PATH: ${{ github.workspace }}/${{ inputs.path }}/.glog/glog-scan.sarif
        MAX_ISSUES_NUMBER: ${{ inputs.max-issues }}
      with:
        github-token: ${{ inputs.github-token != '' && inputs.github-token || github.token }}
        script: |
          const fs = require("fs");

          const sarifPath = process.env.SARIF_PATH;
          if (!sarifPath) throw new Error("SARIF_PATH env is not set");
          if (!fs.existsSync(sarifPath)) throw new Error(`SARIF not found at: ${sarifPath}`);

          const sarif = JSON.parse(fs.readFileSync(sarifPath, "utf8"));
          const run = sarif.runs?.[0];
          const rules = run?.tool?.driver?.rules ?? [];
          const results = run?.results ?? [];

          if (!results.length) {
            core.info("No SARIF results found.");
            core.setOutput("created", "");
            return;
          }

          function pickFingerprint(r) {
            return (
              r.fingerprints?.["glog-fp-ruleFileCode/v1"] ||
              r.partialFingerprints?.["glog-pfp-ruleFileLineCode/v1"] ||
              r.partialFingerprints?.["glog-pfp-ruleFileCode/v1"] ||
              null
            );
          }

          const fingerprintRegex = /glog-fingerprint:\s*([a-f0-9]{32,128}|[^\s]+)/i;
          const existingByFingerprint = new Map();

          let page = 1;
          while (true) {
            const { data } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: "sarif",
              state: "all", 
              per_page: 100,
              page
            });

            if (!data.length) break;

            for (const issue of data) {
              if (issue.pull_request) continue;
              const body = issue.body ?? "";
              const m = body.match(fingerprintRegex);
              if (m) existingByFingerprint.set(m[1], { number: issue.number, state: issue.state });
            }

            if (data.length < 100) break;
            page++;
          }

          core.info(`Loaded ${existingByFingerprint.size} existing issues with fingerprints.`);

          const MAX_ISSUES = Number(process.env.MAX_ISSUES_NUMBER || "30");
          const created = [];
          let createdCount = 0;

          for (const r of results) {
            if (createdCount >= MAX_ISSUES) break;

            const rule = rules.find(x => x.id === r.ruleId);
            const message = r.message?.text ?? rule?.name ?? "Finding";
            const severity = rule?.properties?.severity ?? r.level ?? "UNKNOWN";

            const loc = r.locations?.[0];
            const uri = loc?.physicalLocation?.artifactLocation?.uri ?? "unknown";
            const region = loc?.physicalLocation?.region ?? {};
            const startLine = region.startLine ?? "?";
            const startCol = region.startColumn ?? "?";
            const snippet = region.snippet?.text ?? "";
            const sourceLang = region.sourceLanguage ?? "text";
            const cwe = (rule?.properties?.cwe ?? []).map(x => x.id).join(", ") || "(none)";
            const tags = (rule?.properties?.tags ?? []).join(", ") || "(none)";

            const fp = pickFingerprint(r) ?? `${r.ruleId}:${uri}:${startLine}:${startCol}`;
            const marker = `glog-fingerprint: ${fp}`;

            const helpMd = rule?.help?.markdown ?? "(No remediation markdown in rule)";

            const body = [
              marker,
              ``,
              `> **Copilot instruction:**`,
              `> - Treat this issue as a **focused security remediation task**. Do **not** refactor unrelated code.`,
              `> - **Assess whether the finding represents a real, actionable risk in the current code context.**`,
              `>   - If the finding is not applicable or does not introduce a meaningful security impact, document the reasoning and close the issue.`,
              `>   - If the finding is applicable, proceed with remediation and testing as described below.`,
              ``,
              `**RuleId:** ${r.ruleId}`,
              `**Message:** ${message}`,
              `**Severity:** ${severity}`,
              `**CWE:** ${cwe}`,
              `**Tags:** ${tags}`,
              `**Language:** ${sourceLang}`,
              ``,
              `## Location`,
              `- File: \`${uri}\``,
              `- Line: ${startLine}, Column: ${startCol}`,
              ``,
              snippet ? `## Snippet\n\`\`\`${sourceLang}\n${snippet}\n\`\`\`` : "",
              ``,
              `## Remediation (rule help.markdown)`,
              helpMd,
              ``,
              `## Acceptance criteria`,
              `- Apply a **safe and minimal fix** that resolves the finding without changing existing behavior.`,
              `- **Validate the remediation against the surrounding code context** (data flow, method contracts, error handling, threading, and performance implications).`,
              `- If new dependencies are required:`,
              `  - Use **only the latest stable versions** compatible with the existing technology stack.`,
              `  - Prefer **already-used libraries** in the project over introducing new ones.`,
              `  - Do **not** add dependencies unless strictly necessary.`,
              `- Update or add **unit tests covering the modified code paths**, specifically:`,
              `  - Tests that exercise the **exact lines or branches changed** by the fix.`,
              `  - Include both **positive (expected behavior)** and **negative / edge cases** related to the vulnerability.`,
              `  - Keep tests consistent with existing test frameworks and conventions.`,
              `- Ensure all tests and builds pass:`,
              `- Keep the change **small, reviewable, and well-scoped**.`
            ].filter(Boolean).join("\n");

            const title = `[Glog] ${message} (${uri}:${startLine})`;

            const existing = existingByFingerprint.get(fp);

            if (existing) {
              if (existing.state === "closed") {
                core.info(`Skipping fingerprint ${fp} because issue #${existing.number} is closed (marked as not a vuln).`);
                continue;
              }
              
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                title,
                body
              });
              core.info(`Updated existing issue #${existing.number} for fingerprint ${fp}`);
              continue;
            }

            const issue = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ["sarif", "security", "glog", "copilot"]
            });

            existingByFingerprint.set(fp, issue.data.number);
            created.push(issue.data.number);
            createdCount++;
          }

          core.setOutput("created", created.join(","));

    - name: Assign created issues to Copilot (trigger agent)
      if: ${{ inputs.autofix == 'true' && steps.upload-issues.outputs.created != '' }}
      uses: actions/github-script@v8
      env:
        MAX_ASSIGN_NUMBER: ${{ inputs.max-assign }}
      with:
        github-token: ${{ inputs.github-token != '' && inputs.github-token || github.token }}
        script: |
          const createdCsv = `${{ steps.upload-issues.outputs.created }}`.trim();

          if (!createdCsv) {
            core.info("No created issues to assign.");
            return;
          }

          const issueNumbers = createdCsv
            .split(",")
            .map(s => s.trim())
            .filter(Boolean)
            .map(n => Number(n))
            .filter(n => Number.isFinite(n));

          const MAX_ASSIGN = Number(process.env.MAX_ASSIGN_NUMBER || "30");
          const toAssign = issueNumbers.slice(0, MAX_ASSIGN);

          const { data: repo } = await github.rest.repos.get({
            owner: context.repo.owner,
            repo: context.repo.repo
          });
          const baseBranch = repo.default_branch;

          core.info(`Assigning ${toAssign.length}/${issueNumbers.length} issues to Copilot. base_branch=${baseBranch}`);

          for (const issue_number of toAssign) {
            try {
              await github.rest.issues.addAssignees({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number,
                assignees: ["copilot-swe-agent[bot]"],
                agent_assignment: {
                  target_repo: `${context.repo.owner}/${context.repo.repo}`,
                  base_branch: baseBranch,
                  custom_instructions: [
                    "Open a PR that fixes this issue.",
                    "Keep changes minimal and scoped.",
                    "Run tests/build best effort before opening the PR.",
                    "Explain tradeoffs in the PR description if needed."
                  ].join("\n")
                }
              });

              core.info(`Assigned issue #${issue_number} to Copilot.`);
            } catch (e) {
              core.warning(`Failed to assign issue #${issue_number}: ${e.message}`);
            }
          }

    
